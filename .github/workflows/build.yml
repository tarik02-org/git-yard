name: Build packages

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: runner.os == 'macOS'
        with:
          toolchain: '1.95.0'
          components: clippy,rustfmt
      - name: Check and build Linux
        if: runner.os == 'Linux'
        run: |
          nix develop --command cargo fmt --all -- --check
          nix develop --command cargo test --locked
          nix develop --command cargo clippy --locked --all-targets --all-features -- -D warnings
          nix build .#static
          bash scripts/package.sh result/bin/git-yard '${{ matrix.target }}'
          file dist/git-yard-${{ matrix.target }}/git-yard | grep -E 'static.*linked'
      - name: Check and build macOS
        if: runner.os == 'macOS'
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo build --locked --release --target '${{ matrix.target }}'
          bash scripts/package.sh 'target/${{ matrix.target }}/release/git-yard' '${{ matrix.target }}'
          if otool -L dist/git-yard-${{ matrix.target }}/git-yard | grep -E '/nix/store|/opt/homebrew|/usr/local'; then
            echo 'Binary depends on build-machine libraries' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: git-yard-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
