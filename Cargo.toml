[package]
name = "git-yard"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Pick and clean up Git worktrees across projects"
license = "MIT"
repository = "https://github.com/tarik02-org/git-yard"
readme = "README.md"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
gix = { version = "0.89.0", default-features = false, features = ["status", "parallel", "sha1", "max-performance-safe"] }
jwalk = "0.9.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
libc = "0.2.190"
mimalloc = "0.1.52"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.8"
tempfile = "3.27.0"
unicode-truncate = "3.0.0"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
